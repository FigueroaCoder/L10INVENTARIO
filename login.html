<!DOCTYPE html>
<html>

<head>
<title>Login - L10 ALMACEN</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body class="home">

<h1 style="text-align:center;margin-bottom:20px;">
L10 INVENTORY SYSTEM
</h1>

<div class="main">

<div class="card" style="max-width:400px;margin:auto;margin-top:60px;">

<h2 style="text-align:center;">INICIAR SESIÓN</h2>

<input 
id="user" 
placeholder="Correo"
style="width:100%;padding:10px;margin-bottom:15px;"
>

<input 
id="pass" 
type="password"
placeholder="Contraseña"
style="width:100%;padding:10px;margin-bottom:20px;"
>

<button id="btnLogin" style="width:100%;">
Entrar
</button>

</div>

</div>

<div class="footer-login">
© 2026 <span class="label">Programmer:</span> 
<span class="name">Roberto Figueroa</span>, 
<span class="label">Collaborating Programmer:</span> 
<span class="name">Jesús Vásquez</span>, 
<span class="label">Idea & Concept:</span> 
<span class="name">Roberto Figueroa</span>, 
<span class="name">Adán Ávila</span>
</div>

<script type="module">

import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";

import { 
  getAuth, 
  signInWithEmailAndPassword, 
  setPersistence, 
  browserLocalPersistence,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAX-WKQe_AvWQzNswGC1QIMRzz3RTMZB2o",
  authDomain: "almacen-web-2026.firebaseapp.com",
  projectId: "almacen-web-2026",
  storageBucket: "almacen-web-2026.firebasestorage.app",
  messagingSenderId: "777489188342",
  appId: "1:777489188342:web:992bdeeeaa8bd89409f3d7",
  measurementId: "G-EX9YG2K41P"
};

const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const auth = getAuth(app);

// CONTROL DE SESIÓN (SOLO SI YA EXISTE)
onAuthStateChanged(auth, (user) => {
  if (user) {
    window.location.replace("index.html");
  }
});

// DOM READY
document.addEventListener("DOMContentLoaded", () => {

  const btn = document.getElementById("btnLogin");

  btn.addEventListener("click", loginUser);

  document.getElementById("pass").addEventListener("keypress", (e) => {
    if (e.key === "Enter") loginUser();
  });

});

// LOGIN
async function loginUser(){

  const btn = document.getElementById("btnLogin");
  btn.disabled = true;

  const email = document.getElementById("user").value.trim();
  const password = document.getElementById("pass").value.trim();

  if(!email || !password){
    alert("Completa todos los campos");
    btn.disabled = false;
    return;
  }

  try {

    await setPersistence(auth, browserLocalPersistence);

    await signInWithEmailAndPassword(auth, email, password);

    // SOLO REDIRECCIÓN FINAL
    window.location.replace("index.html");

  } catch (error) {

    console.error(error);
    alert(error.code + " - " + error.message);

    btn.disabled = false;
  }

}

</script>

</body>
</html>
