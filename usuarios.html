<!DOCTYPE html>
<html>

<head>
<title>Administrar Usuarios</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- USER BAR -->
<div class="user-bar">
<span id="usuarioActivo">Cargando...</span>
<button onclick="logout()">Cerrar sesión</button>
</div>

<div class="main">

<div class="card">

<h2>Administrar usuarios</h2>

<input id="nuevoUser" placeholder="Correo del usuario">
<input id="nuevoPass" type="password" placeholder="Contraseña">

<select id="rol">
  <option value="user">Usuario</option>
  <option value="admin">Admin</option>
</select>

<button onclick="crearUsuario()">Crear usuario</button>

<br><br>

<table>
<thead>
<tr>
<th>Email</th>
<th>Rol</th>
<th>Eliminar</th>
</tr>
</thead>

<tbody id="listaUsuarios"></tbody>

</table>

</div>

</div>

<!-- AUTH GLOBAL -->
<script type="module" src="auth-global.js"></script>

<!-- LÓGICA -->
<script type="module">

import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAX-WKQe_AvWQzNswGC1QIMRzz3RTMZB2o",
  authDomain: "almacen-web-2026.firebaseapp.com",
  projectId: "almacen-web-2026",
  storageBucket: "almacen-web-2026.firebasestorage.app",
  messagingSenderId: "777489188342",
  appId: "1:777489188342:web:992bdeeeaa8bd89409f3d7"
};

const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* =====================
ESPERAR SESIÓN + VALIDAR ADMIN
===================== */

function waitForAuth(){

  const interval = setInterval(() => {

    if (!window.currentUser) return;

    // BLOQUEO REAL
    if (window.currentRole !== "admin") {
      alert("Acceso denegado");
      window.location.href = "index.html";
      return;
    }

    clearInterval(interval);

    cargarUsuarios();

  }, 200);

}

waitForAuth();

/* =====================
CREAR USUARIO
===================== */

let secondaryApp;
let secondaryAuth;

async function getSecondaryAuth(){

  if (!secondaryApp){
    const { initializeApp: init } = await import("https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js");
    secondaryApp = init(firebaseConfig, "SecondaryUsers");
    secondaryAuth = getAuth(secondaryApp);
  }

  return secondaryAuth;
}

window.crearUsuario = async function(){

  if (window.currentRole !== "admin"){
    alert("Solo admin");
    return;
  }

  const email = document.getElementById("nuevoUser").value.trim();
  const pass = document.getElementById("nuevoPass").value.trim();
  const rol = document.getElementById("rol").value;

  if(!email || !pass){
    alert("Completa todos los campos");
    return;
  }

  try {

    const secAuth = await getSecondaryAuth();

    await createUserWithEmailAndPassword(secAuth, email, pass);

    await addDoc(collection(db, "usuarios"), {
      email,
      role: rol
    });

    alert("Usuario creado");

    cargarUsuarios();

  } catch (e) {
    console.error(e);
    alert("Error: " + e.message);
  }

};

/* =====================
MOSTRAR USUARIOS
===================== */

async function cargarUsuarios(){

  const tabla = document.getElementById("listaUsuarios");
  tabla.innerHTML = "";

  const snapshot = await getDocs(collection(db, "usuarios"));

  snapshot.forEach((docu) => {

    const data = docu.data();

    const fila = document.createElement("tr");

    fila.innerHTML = `
      <td>${data.email}</td>
      <td>${data.role}</td>
      <td>
        ${window.currentRole === "admin"
          ? `<button onclick="eliminarUsuario('${docu.id}')">Eliminar</button>`
          : ""
        }
      </td>
    `;

    tabla.appendChild(fila);

  });

}

/* =====================
ELIMINAR USUARIO
===================== */

window.eliminarUsuario = async function(id){

  if (window.currentRole !== "admin"){
    alert("Solo admin");
    return;
  }

  await deleteDoc(doc(db, "usuarios", id));
  cargarUsuarios();

};

</script>

</body>
</html>
