<!DOCTYPE html>
<html>

<head>
<title>Historial</title>
<link rel="stylesheet" href="style.css">

<style>
/* evitar parpadeo */
body{
opacity:0;
transition:opacity 0.3s ease;
}
body.loaded{
opacity:1;
}
</style>

</head>

<body>

<div class="sidebar">
<h2>L10 ALMACEN</h2>

<a href="index.html">Inicio</a>
<a href="entrada.html">Registrar Entrada</a>
<a href="salida.html">Registrar Salida</a>
<a href="stock.html">Inventario</a>
<a href="historial.html">Historial</a>

<a id="adminMenu" href="usuarios.html">Usuarios</a>
</div>

<div class="user-bar">
<span id="usuarioActivo">Cargando...</span>
<button onclick="logout()">Cerrar sesión</button>
</div>

<div class="main">

<div class="card">

<h2>Historial de movimientos</h2>

<input 
id="valor" 
placeholder="Buscar en historial..."
onkeyup="filtrarHistorial()"
>

<select id="tipoFiltro" onchange="filtrarHistorial()">
<option value="todos">Todos</option>
<option value="ENTRADA">Solo Entradas</option>
<option value="SALIDA">Solo Salidas</option>
</select>

<button id="btnExport">📊 Exportar historial CSV</button>
<button onclick="resetHistorial()">🔄 Actualizar historial</button>

<table id="tablaCompletaHistorial">

<thead>
<tr>
<th>Fecha</th>
<th>Movimiento</th>
<th>ID</th>
<th>Producto</th>
<th>Cantidad</th>
<th>Responsable</th>
<th>Comentarios</th>
</tr>
</thead>

<tbody id="tablaHistorial"></tbody>

</table>

</div>

</div>

<!-- AUTH -->
<script type="module" src="auth-global.js"></script>

<!-- APP -->
<script type="module" src="app.js"></script>

<!-- CARGA SIN PARPADEO -->
<script>
document.addEventListener("DOMContentLoaded", async () => {

  let intentos = 0;

  while (!window.currentUser && intentos < 20) {
    await new Promise(r => setTimeout(r, 100));
    intentos++;
  }

  console.log("Historial listo");

  if (typeof window.viewHistory === "function") {
    window.viewHistory();
  }

  document.body.classList.add("loaded");

});
</script>

<!-- FILTRO -->
<script>
function filtrarHistorial(){

let texto = document.getElementById("valor").value.toLowerCase();
let filtro = document.getElementById("tipoFiltro").value;

let filas = document.querySelectorAll("#tablaHistorial tr");

filas.forEach(fila => {

let contenido = fila.innerText.toLowerCase();
let tipo = fila.children[1]?.innerText;

let coincideTexto = contenido.includes(texto);
let coincideTipo = (filtro === "todos") || (tipo === filtro);

fila.style.display = (coincideTexto && coincideTipo) ? "" : "none";

});
}
</script>

<!-- RESET -->
<script>
function resetHistorial(){

document.getElementById("valor").value = "";
document.getElementById("tipoFiltro").value = "todos";

let filas = document.querySelectorAll("#tablaHistorial tr");
filas.forEach(fila=>{
fila.style.display = "";
});

if(typeof window.viewHistory === "function"){
window.viewHistory();
}

}
</script>

<!-- EXPORTACIÓN -->
<script>
function exportarHistorial(){

let tabla = document.getElementById("tablaCompletaHistorial");

if(!tabla){
alert("No se encontró la tabla");
return;
}

let csv = "";

let headers = tabla.querySelectorAll("thead th");
let headRow = [];

headers.forEach(h=>{
headRow.push(h.innerText.replace(/,/g," "));
});

csv += headRow.join(",") + "\n";

let filas = tabla.querySelectorAll("tbody tr");

filas.forEach(fila=>{

if(fila.style.display === "none") return;

let cols = fila.querySelectorAll("td");
let row = [];

cols.forEach(col=>{
row.push(col.innerText.replace(/,/g," "));
});

if(row.length > 0){
csv += row.join(",") + "\n";
}

});

let blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
let link = document.createElement("a");

link.href = URL.createObjectURL(blob);
link.download = "historial.csv";
link.click();
}

// activar botón
document.addEventListener("DOMContentLoaded", () => {
let btn = document.getElementById("btnExport");
if(btn){
btn.addEventListener("click", exportarHistorial);
}
});
</script>

</body>
</html>
